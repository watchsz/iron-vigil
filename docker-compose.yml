services:
  dev:
    build: { context: ., dockerfile: docker/Dockerfile, target: dev }
    ports: ["5173:5173"]
    volumes: [".:/app", "/app/node_modules"]

  test:
    build: { context: ., dockerfile: docker/Dockerfile, target: deps }
    volumes: [".:/app", "/app/node_modules"]
    command: sh -c "npx tsc --noEmit && npm test"

  e2e:
    build: { context: ., dockerfile: docker/e2e.Dockerfile }
    volumes: ["./playwright-report:/app/playwright-report"]

  web:
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    ports: ["8090:80"]

  assets:
    build: { context: ., dockerfile: docker/assets.Dockerfile }
    platform: linux/amd64
    volumes: ["./assets-src:/app/assets-src:ro", "./tools:/app/tools:ro", "./public/assets:/app/public/assets"]
