name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p public/assets && docker compose run --rm assets # .blend -> .glb, échoue si budget dépassé
      - uses: actions/upload-artifact@v4
        with: { name: assets, path: public/assets }

  test:
    needs: assets
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: assets, path: public/assets }
      - run: npm ci
      - run: npm run build # tsc + vite
      - run: npm test
      - run: npx playwright test
        env: { HOME: /root } # Firefox/Chromium exigent HOME=/root dans ce conteneur
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 14 }
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
