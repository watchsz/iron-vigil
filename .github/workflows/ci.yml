name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build # tsc + vite
      - run: npm test
      - run: npx playwright test
        env: { HOME: /root } # Firefox/Chromium exigent HOME=/root dans ce conteneur
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 14 }
