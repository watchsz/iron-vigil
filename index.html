<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iron Vigil</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 14px/1.4 monospace; color: #e8d8c0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; pointer-events: none; }
      #hud button { pointer-events: auto; font: inherit; color: inherit; background: #2a1810; border: 1px solid #6a4a30; padding: 4px 8px; cursor: pointer; }
      #hud button.selected { border-color: #ffd080; }
      #hud button:disabled { opacity: 0.4; cursor: default; }
      #towers { display: flex; gap: 6px; }
      button { font: inherit; color: inherit; background: #2a1810; border: 1px solid #6a4a30; padding: 4px 8px; cursor: pointer; }
      button:disabled { opacity: 0.4; cursor: default; }
      #message { position: fixed; top: 35%; width: 100%; text-align: center; font-size: 48px; pointer-events: none; }
      #end { position: fixed; top: 50%; width: 100%; display: flex; gap: 12px; justify-content: center; }
      #panel { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
               background: #140a06e0; border: 1px solid #6a4a30; padding: 8px 12px; }
      #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
              background: #0a0302b0; }
      #menu h1 { font-size: 56px; margin: 0; letter-spacing: 8px; color: #d04020; text-shadow: 0 0 12px #000; }
      #levels { display: flex; flex-direction: column; gap: 8px; min-width: 280px; }
      #boss { position: fixed; top: 48px; left: 50%; transform: translateX(-50%); width: min(480px, 80vw); text-align: center; color: #d04020; }
      #boss > div { height: 8px; border: 1px solid #6a2010; background: #140404; }
      #bossHp { height: 100%; background: #a01808; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="hud">
      <span>Or <b id="gold"></b></span>
      <span>Vies <b id="lives"></b></span>
      <span>Vague <b id="waveNum"></b></span>
      <span id="towers"></span>
      <button id="wave">Lancer la vague (Espace)</button>
      <span id="levelName"></span>
      <span style="opacity:.5">son : M · caméra : glisser / molette</span>
    </div>
    <div id="panel" hidden><span id="panelName"></span><button id="upgrade"></button><button id="sell"></button></div>
    <div id="boss" hidden>Apôtre<div><div id="bossHp"></div></div></div>
    <div id="message"></div>
    <div id="end" hidden></div>
    <div id="menu" hidden><h1>IRON VIGIL</h1><div id="levels"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
